    name: "CZ-EU Enforcement Gap"
    jurisdictions: ["JUR::CZ", "JUR::EU"]
    logic: >
      ECHR finds violation → CZ institution continues practice →
      no enforcement mechanism forces change → gap between ruling and reality.
    axioms: ["A6::DELEGATE", "A12::SELFCERT"]
    selfcheck_code: "SCN::OPP::INDEP_RUBBER"
    sus: "Court delegates finding, institution self-certifies compliance"

  - id: "XJUR::INTL_CZ_CRPD"
    name: "CRPD Ratification Without Implementation"
    jurisdictions: ["JUR::INTL", "JUR::CZ"]
    logic: >
      CZ ratifies CRPD → audit finds 0% compliance →
      ratification used as evidence of commitment → A1::SILENCE:
      the signature exists, the implementation does not.
    axioms: ["A1::SILENCE", "A12::SELFCERT"]
    selfcheck_code: "SCN::OPP::EVID_PRES_ABS"
    sus: "Signature ≠ evidence of compliance. Null-evidence axiom applies."

  - id: "XJUR::US_EU_DISCLOSURE"
    name: "SEC Disclosure vs GDPR Protection"
    jurisdictions: ["JUR::US", "JUR::EU"]
    logic: >
      US SEC forces material risk disclosure (public) →
      EU GDPR protects health data (private) →
      forensic system must navigate both: expose institutional failure
      while encrypting subject data.
    axioms: ["A12::SELFCERT", "A9::CONSENT"]
    selfcheck_code: "SCN::GATE::FDO_EMIT"
    sus: "Disclosure and protection are not contradictory — the system does both."

  - id: "XJUR::SPACE_CZ_EXPOSURE"
    name: "Long-Duration Exposure Pattern"
    jurisdictions: ["JUR::SPACE", "JUR::CZ"]
    logic: >
      NASA: microgravity degrades neuro-ocular function over time →
      CZ: long-term antipsychotic exposure degrades metabolic/endocrine function →
      same structural pattern: cumulative system damage from sustained exposure,
      monitored by the entity causing the exposure.
    axioms: ["A3::IATROGEN", "A5::MONOPOLY"]
    selfcheck_code: "SCN::SEQ::IATRO_BR"
    sus: "The monitoring system is compromised by the system it monitors."

